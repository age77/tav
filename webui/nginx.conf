server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Die Seite aendert sich mit jedem neuen Abbild. Ohne no-store zeigt der
    # Browser nach einer Aenderung die alte Fassung.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Der Beispieltext im Eingabefeld, gleiche Ueberlegung wie oben.
    location = /beispiel.txt {
        add_header Cache-Control "no-store";
        charset utf-8;
    }

    # Die Anleitung zum Herunterladen, gleiche Ueberlegung wie oben. Ohne
    # eigenen Typ liefert nginx .md als Download-Brocken aus.
    location = /SPRECHTEXT-ANLEITUNG.md {
        add_header Cache-Control "no-store";
        default_type text/markdown;
        # charset allein wirkt nur auf bekannte Typen, text/markdown gehoert
        # nicht dazu - ohne die Ergaenzung fehlte die Angabe im Kopf.
        charset_types text/markdown;
        charset utf-8;
    }

    # Stil und Skripte der Seite: der Browser fragt bei jedem Laden nach, ob
    # sich etwas geaendert hat, und bekommt meist nur "unveraendert" zurueck.
    # Ein zwischengespeichertes altes Skript passte sonst nicht mehr zur neuen
    # Seite, die nie aus dem Speicher kommt.
    location /js/ {
        add_header Cache-Control "no-cache";
        charset utf-8;
    }
    location = /tav.css {
        add_header Cache-Control "no-cache";
        charset_types text/css;
        charset utf-8;
    }

    # Die DejaVu-Schriften fuer die Untertitel-Vorschau. nginx kennt .ttf nicht
    # von selbst; die Dateien aendern sich nur mit dem Abbild.
    location /fonts/ {
        types { font/ttf ttf; }
        add_header Cache-Control "private, max-age=2592000";
    }

    # Videodienst. Der Name wird erst bei Bedarf aufgeloest, damit nginx auch
    # startet, wenn tav-video nicht laeuft. Hochgeladen wird in Stuecken
    # von 32 MB; gepuffert wird nichts, Kodieren kann dauern.
    location /video/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $video_upstream http://tav-video:8000;
        rewrite ^/video/(.*)$ /$1 break;
        proxy_pass $video_upstream;
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Abschriftdienst, gleiche Ueberlegung wie beim Video. Mitschreiben kann
    # bei einem langen Film viele Minuten dauern.
    location /whisper/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $whisper_upstream http://tav-whisper:8000;
        rewrite ^/whisper/(.*)$ /$1 break;
        proxy_pass $whisper_upstream;
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://tav-onnx:8881/v1/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
